<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>График работы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        var API_URL = '/api/data';
        var DEFAULT_PASSWORD = '1234';
        var SS_EDIT = 'sched_edit';
        var MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        var MONTHS_GEN = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
        var DAY_NAMES = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    </script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] }, colors: {
                bg: '#f0f1f5', card: '#ffffff', panel: '#f7f8fa',
                accent: '#c2740e', 'accent-dim': 'rgba(194,116,14,0.08)',
                fg: '#1c1f26', muted: '#9298a5', border: '#e3e5ea',
                danger: '#dc2626', success: '#16a34a',
            }}}
        }
    </script>
    <style>
        :root{--bg:#f0f1f5;--card:#fff;--panel:#f7f8fa;--accent:#c2740e;--accent-glow:rgba(194,116,14,0.07);--fg:#1c1f26;--muted:#9298a5;--border:#e3e5ea;--danger:#dc2626;--success:#16a34a;--morning:#d4880a;--morning-bg:rgba(212,136,10,0.07);--morning-border:rgba(212,136,10,0.22);--evening:#5472a8;--evening-bg:rgba(84,114,168,0.06);--evening-border:rgba(84,114,168,0.2)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:0;min-height:100dvh;overflow-x:hidden}
        body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px)}
        body::before{top:-25%;right:-20%;width:70vw;height:70vw;background:radial-gradient(circle,rgba(194,116,14,0.045)0%,transparent 70%)}
        body::after{bottom:-20%;left:-15%;width:55vw;height:55vw;background:radial-gradient(circle,rgba(84,114,168,0.035)0%,transparent 70%)}
        #app{position:relative;z-index:1}
        #loadingOverlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
        #loadingOverlay.hide{opacity:0;pointer-events:none}
        .loader{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .edit-header-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.04);flex-shrink:0}
        .edit-header-btn:active{transform:scale(.92)}
        .edit-header-btn.is-active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
        .month-nav-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .month-nav-btn:active{transform:scale(.92);background:var(--panel)}
        .grid-header{display:flex;align-items:center;gap:6px;padding:6px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:10}
        .gh-day{width:54px;flex-shrink:0}
        .gh-label{flex:1;text-align:center;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
        .gh-label.morning-label{color:var(--morning)}
        .gh-label.evening-label{color:var(--evening);margin-left:10px;padding-left:10px;border-left:1.5px solid var(--border)}
        .gh-label i{margin-right:3px;font-size:9px}
        .day-row{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:5px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:opacity .2s,border-color .2s,box-shadow .2s;border-left:3px solid transparent}
        .day-row.is-today{border-left-color:var(--accent);box-shadow:0 1px 6px rgba(194,116,14,.1);background:linear-gradient(to right,rgba(194,116,14,.03),var(--card) 40%)}
        .day-row.is-past:not(.is-today){opacity:.45}
        .dr-info{width:54px;flex-shrink:0;text-align:center}
        .dr-name{font-size:13px;font-weight:800;color:var(--fg);line-height:1.2}
        .dr-date{font-size:10px;color:var(--muted);font-weight:500;line-height:1.2;margin-top:1px}
        .dr-today-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0;animation:pulse-dot 2s ease-in-out infinite}
        @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
        .slot-group{display:flex;gap:4px;flex:1;min-width:0}
        .slot-group.evening-group{margin-left:10px;padding-left:10px;border-left:1.5px solid var(--border)}
        .slot{flex:1;min-width:0;min-height:44px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 5px;line-height:1.25;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;transition:all .15s}
        .slot.view{cursor:default;border:1px solid transparent}
        .slot.view.morning.filled{background:var(--morning-bg);color:var(--fg);border-color:var(--morning-border)}
        .slot.view.evening.filled{background:var(--evening-bg);color:var(--fg);border-color:var(--evening-border)}
        .slot.view.empty{color:var(--muted);opacity:.35;font-size:13px}
        .slot.edit{cursor:pointer;border:1.5px dashed var(--border);background:transparent;color:var(--muted)}
        .slot.edit:active{transform:scale(.95)}
        .slot.edit.morning.filled{border-style:solid;border-color:var(--morning-border);background:var(--morning-bg);color:var(--fg)}
        .slot.edit.evening.filled{border-style:solid;border-color:var(--evening-border);background:var(--evening-bg);color:var(--fg)}
        .slot.edit.empty i{font-size:10px}
        .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
        .sheet-panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:12px 20px 28px;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:101;max-height:75vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,.08)}
        .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
        .bottom-sheet.active .sheet-overlay{opacity:1;pointer-events:auto}
        .bottom-sheet.active .sheet-panel{transform:translateY(0)}
        .picker-item{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--fg);font-size:14px;font-weight:500;text-align:left;cursor:pointer;transition:all .15s;font-family:inherit;display:block;margin-bottom:6px}
        .picker-item:active{transform:scale(.98)}
        .picker-item.is-selected{border-color:var(--accent);background:var(--accent-glow);color:var(--accent);font-weight:600}
        .emp-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);margin-bottom:6px}
        .emp-item span{font-size:14px;font-weight:500}
        .emp-del{width:34px;height:34px;border-radius:8px;border:none;background:rgba(220,38,38,.06);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;flex-shrink:0}
        .emp-del:active{transform:scale(.9);background:rgba(220,38,38,.15)}
        .btn-primary{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
        .btn-primary:active{transform:scale(.97);opacity:.85}
        .btn-secondary{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
        .btn-secondary:active{transform:scale(.97);background:var(--panel)}
        .btn-danger-outline{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(220,38,38,.2);background:rgba(220,38,38,.04);color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
        .btn-danger-outline:active{transform:scale(.97);background:rgba(220,38,38,.1)}
        .input-field{width:100%;padding:14px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel);color:var(--fg);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
        .input-field::placeholder{color:var(--muted)}
        .input-field:focus{border-color:var(--accent)}
        .footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:50;display:flex;justify-content:center;transition:transform .3s,opacity .3s}
        .footer-bar.hidden-bar{transform:translateY(100%);opacity:0;pointer-events:none}
        .footer-btn-single{padding:11px 32px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .footer-btn-single i{font-size:14px;color:var(--accent)}
        .footer-btn-single:active{transform:scale(.95)}
        .toast-container{position:fixed;top:16px;left:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:auto;box-shadow:0 4px 15px rgba(0,0,0,.08)}
        .toast.show{opacity:1;transform:translateY(0)}
        .toast.success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
        .toast.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
        .toast.info{background:#fffbeb;color:var(--accent);border:1px solid #fde68a}
        .empty-state{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px}
        #scheduleGrid,#budgetView{transition:opacity .18s ease,transform .18s ease}
        #scheduleGrid.switching,#budgetView.switching{opacity:0;transform:translateY(6px)}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
        .shake{animation:shake .4s ease}
        .divider{height:1px;background:var(--border);margin:16px 0}
        .scroll-top-btn{position:fixed;bottom:78px;right:14px;width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--fg);border:1px solid var(--border);cursor:pointer;z-index:45;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
        .scroll-top-btn.visible{opacity:1;transform:translateY(0);pointer-events:auto}
        .scroll-top-btn:active{transform:scale(.9)}
        .section-tabs{display:none;gap:4px;margin:0 16px 12px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .section-tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:10px 8px;border-radius:9px;cursor:pointer;transition:all .15s}
        .section-tab:active{transform:scale(.97)}
        .section-tab.is-active{background:var(--accent);color:#fff}
        .section-tab i,.pay-tab i{margin-right:6px}
        .pay-tabs{display:flex;gap:4px;margin:0 16px 12px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
        .pay-tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:9px;cursor:pointer;transition:all .15s}
        .pay-tab:active{transform:scale(.97)}
        .pay-tab.is-active{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.06)}
        .budget-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 12px}
        .budget-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .budget-card .lbl{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
        .budget-card .val{font-size:14px;font-weight:800;margin-top:4px;line-height:1.2;word-break:break-word}
        .budget-card .val.income{color:var(--success)}
        .budget-card .val.expense{color:var(--danger)}
        .budget-list{padding:0 16px}
        .budget-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .budget-item .bi-main{flex:1;min-width:0}
        .budget-item .bi-note{font-size:14px;font-weight:600;color:var(--fg);line-height:1.3}
        .budget-item .bi-date{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
        .budget-item .bi-sum{font-size:14px;font-weight:800;white-space:nowrap}
        .budget-item .bi-sum.income{color:var(--success)}
        .budget-item .bi-sum.expense{color:var(--danger)}
        .type-toggle{display:flex;gap:6px}
        .type-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
        .type-btn.is-income.is-active{border-color:var(--success);background:rgba(22,163,74,.08);color:var(--success)}
        .type-btn.is-expense.is-active{border-color:var(--danger);background:rgba(220,38,38,.06);color:var(--danger)}
        .type-btn.is-pay.is-active{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.05ms!important}}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    </style>
</head>
<body>
<div id="loadingOverlay"><div class="loader"></div><p class="text-sm font-semibold text-muted mt-4">Загрузка графика...</p></div>
<div id="app" style="opacity:0;transition:opacity .4s">
    <header class="flex items-center justify-between px-4 pt-5 pb-2">
        <div><h1 id="pageTitle" class="text-lg font-extrabold tracking-tight text-fg">График работы</h1><p id="modeLabel" class="text-[11px] font-semibold text-muted mt-0.5">Режим просмотра</p></div>
        <button class="edit-header-btn" id="editBtn" aria-label="Редактирование" title="Редактирование"><i class="fas fa-lock"></i></button>
    </header>
    <div class="section-tabs" id="sectionTabs">
        <button type="button" class="section-tab is-active" id="tabSchedule"><i class="fas fa-calendar-days"></i> График</button>
        <button type="button" class="section-tab" id="tabBudget"><i class="fas fa-wallet"></i> Бюджет</button>
    </div>
    <nav class="flex items-center justify-between px-4 mb-3">
        <button class="month-nav-btn" id="prevMonth" aria-label="Предыдущий месяц"><i class="fas fa-chevron-left"></i></button>
        <div class="text-center"><span id="monthLabel" class="text-sm font-bold text-fg"></span><button id="todayBtn" class="block mx-auto mt-1 text-[11px] font-bold text-accent bg-accent-dim px-3 py-1 rounded-full border border-transparent hover:border-accent/30 transition-all">Текущий месяц</button></div>
        <button class="month-nav-btn" id="nextMonth" aria-label="Следующий месяц"><i class="fas fa-chevron-right"></i></button>
    </nav>
    <main id="scheduleGrid" class="pb-16"></main>
    <main id="budgetView" class="pb-24" style="display:none"></main>
</div>
<button class="scroll-top-btn" id="scrollTopBtn" aria-label="Наверх"><i class="fas fa-arrow-up"></i></button>
<footer class="footer-bar hidden-bar" id="footerBar"><button class="footer-btn-single" id="employeesBtn" aria-label="Сотрудники"><i class="fas fa-users"></i><span>Сотрудники</span></button><button class="footer-btn-single" id="addBudgetBtn" aria-label="Добавить операцию" style="display:none"><i class="fas fa-plus"></i><span>Операция</span></button></footer>
<div class="bottom-sheet" id="pickerSheet"><div class="sheet-overlay" data-close="pickerSheet"></div><div class="sheet-panel"><div class="sheet-handle"></div><h3 class="text-base font-bold text-fg mb-4">Выбрать сотрудника</h3><div id="pickerList"></div><div class="mt-3"><button class="btn-danger-outline" id="clearSlotBtn" style="display:none"><i class="fas fa-eraser"></i> Очистить слот</button></div><div class="mt-3"><button class="btn-secondary" data-close="pickerSheet">Отмена</button></div></div></div>
<div class="bottom-sheet" id="employeesSheet"><div class="sheet-overlay" data-close="employeesSheet"></div><div class="sheet-panel"><div class="sheet-handle"></div><h3 class="text-base font-bold text-fg mb-4">Список сотрудников</h3><div class="flex gap-2 mb-4"><input type="text" class="input-field" id="newEmpInput" placeholder="Фамилия И.О." maxlength="40"><button class="btn-primary" style="width:auto;padding:14px 16px;flex-shrink:0" id="addEmpBtn"><i class="fas fa-plus"></i></button></div><div id="employeesList"></div><div class="divider"></div><p class="text-[11px] font-bold text-muted mb-3 uppercase tracking-wider">Смена пароля</p><input type="password" class="input-field mb-2" id="newPwInput" placeholder="Новый пароль" maxlength="30"><button class="btn-secondary" id="changePwBtn" style="font-size:13px;padding:12px"><i class="fas fa-key"></i> Сохранить пароль</button><div class="mt-4"><button class="btn-secondary" data-close="employeesSheet">Закрыть</button></div></div></div>
<div class="bottom-sheet" id="passwordSheet"><div class="sheet-overlay" data-close="passwordSheet"></div><div class="sheet-panel"><div class="sheet-handle"></div><h3 class="text-base font-bold text-fg mb-1">Ввод пароля</h3><p class="text-xs text-muted mb-4">Откроется редактирование и вкладка «Бюджет»</p><input type="password" class="input-field mb-3" id="pwInput" placeholder="Пароль" maxlength="30"><button class="btn-primary mb-3" id="submitPwBtn">Войти</button><button class="btn-secondary" data-close="passwordSheet">Отмена</button></div></div>
<div class="bottom-sheet" id="budgetSheet"><div class="sheet-overlay" data-close="budgetSheet"></div><div class="sheet-panel"><div class="sheet-handle"></div><h3 class="text-base font-bold text-fg mb-4">Новая операция</h3><div class="type-toggle mb-3"><button type="button" class="type-btn is-pay is-active" id="payCash"><i class="fas fa-money-bill-wave"></i> Наличные</button><button type="button" class="type-btn is-pay" id="payCashless"><i class="fas fa-credit-card"></i> Безналичные</button></div><div class="type-toggle mb-3"><button type="button" class="type-btn is-expense is-active" id="typeExpense">Расход</button><button type="button" class="type-btn is-income" id="typeIncome">Доход</button></div><input type="text" class="input-field mb-2" id="budgetAmount" placeholder="Сумма, ₽" inputmode="decimal" maxlength="12"><input type="date" class="input-field mb-2" id="budgetDate"><input type="text" class="input-field mb-3" id="budgetNote" placeholder="Комментарий" maxlength="80"><button class="btn-primary mb-3" id="saveBudgetBtn">Сохранить</button><button class="btn-secondary" data-close="budgetSheet">Отмена</button></div></div>
<div class="toast-container" id="toastContainer"></div>
<script>
var employees=[],schedule={},budget=[],isEditMode=false,activeView='schedule',budgetType='expense',budgetPay='cash',viewYear,viewMonth,activeSheet=null,selectedSlot=null,savingLock=false;
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function getWeekday(d){var w=d.getDay();return w===0?6:w-1}
function loadData(cb){fetch(API_URL).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(data){employees=data.employees||[];schedule=data.schedule||{};budget=Array.isArray(data.budget)?data.budget:[];if(data.password)sessionStorage.setItem('cached_pw',data.password);cb()}).catch(function(){showToast('Ошибка загрузки данных','error');cb()})}
function saveData(cb){if(savingLock)return;savingLock=true;fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({employees:employees,schedule:schedule,budget:budget,password:getPassword()})}).then(function(r){if(!r.ok)throw new Error();savingLock=false;if(cb)cb()}).catch(function(){savingLock=false;showToast('Ошибка сохранения','error');if(cb)cb()})}
function getPassword(){return sessionStorage.getItem('cached_pw')||DEFAULT_PASSWORD}
function onFirstLoad(){document.getElementById('loadingOverlay').classList.add('hide');setTimeout(function(){document.getElementById('loadingOverlay').style.display='none'},400);document.getElementById('app').style.opacity='1';isEditMode=sessionStorage.getItem(SS_EDIT)==='1';var now=new Date();viewYear=now.getFullYear();viewMonth=now.getMonth();render();setTimeout(function(){var el=document.querySelector('.day-row.is-today');if(el)el.scrollIntoView({behavior:'instant',block:'center'})},50)}
function render(){renderMonthNav();if(activeView==='budget'&&isEditMode){document.getElementById('scheduleGrid').style.display='none';document.getElementById('budgetView').style.display='block';renderBudget()}else{activeView='schedule';document.getElementById('budgetView').style.display='none';document.getElementById('scheduleGrid').style.display='';renderSchedule()}renderTabs();renderHeader();renderFooter()}
function renderTabs(){var tabs=document.getElementById('sectionTabs');tabs.style.display=isEditMode?'flex':'none';document.getElementById('tabSchedule').classList.toggle('is-active',activeView!=='budget');document.getElementById('tabBudget').classList.toggle('is-active',activeView==='budget')}
function renderMonthNav(){document.getElementById('monthLabel').textContent=MONTHS_FULL[viewMonth]+' '+viewYear}
function renderSchedule(){var grid=document.getElementById('scheduleGrid');if(!grid)return;var daysCount=getDaysInMonth(viewYear,viewMonth);var todayStr=fmtDate(new Date());var todayDate=new Date();todayDate.setHours(0,0,0,0);var html='<div class="grid-header"><div class="gh-day"></div><div class="gh-label morning-label"><i class="fas fa-sun"></i> 8:00\u201315:30</div><div class="gh-label evening-label"><i class="fas fa-moon"></i> 15:30\u201323:00</div></div>';for(var day=1;day<=daysCount;day++){var d=new Date(viewYear,viewMonth,day);var dk=fmtDate(d);var isToday=dk===todayStr;d.setHours(0,0,0,0);var isPast=d<todayDate;var weekday=getWeekday(d);var ds=schedule[dk]||{morning:['',''],evening:['','']};var cls='day-row';if(isToday)cls+=' is-today';else if(isPast)cls+=' is-past';html+='<div class="'+cls+'"><div class="dr-info"><div class="dr-name">'+DAY_NAMES[weekday]+'</div><div class="dr-date">'+day+' '+MONTHS_GEN[viewMonth]+'</div>';html+=isToday?'<div class="dr-today-dot"></div>':'<div style="height:5px"></div>';html+='</div><div class="slot-group">';html+=slotHTML(dk,'morning',0,ds.morning[0])+slotHTML(dk,'morning',1,ds.morning[1]);html+='</div><div class="slot-group evening-group">';html+=slotHTML(dk,'evening',0,ds.evening[0])+slotHTML(dk,'evening',1,ds.evening[1]);html+='</div></div>'}grid.innerHTML=html}
function slotHTML(dk,shift,idx,value){var cls=value?'filled':'empty';var mode=isEditMode?'edit':'view';if(isEditMode)return '<button class="slot '+mode+' '+shift+' '+cls+'" onclick="openPicker(\''+dk+'\',\''+shift+'\','+idx+')">'+(value||'<i class="fas fa-plus"></i>')+'</button>';return '<div class="slot '+mode+' '+shift+' '+cls+'">'+(value||'\u2014')+'</div>'}
function renderHeader(){var btn=document.getElementById('editBtn');var label=document.getElementById('modeLabel');var title=document.getElementById('pageTitle');if(isEditMode){btn.classList.add('is-active');btn.innerHTML='<i class="fas fa-lock-open"></i>';label.textContent=activeView==='budget'?(budgetPay==='cashless'?'Безналичные':'Наличные'):'Режим редактирования';label.style.color='var(--accent)';title.textContent=activeView==='budget'?'Бюджет':'График работы'}else{btn.classList.remove('is-active');btn.innerHTML='<i class="fas fa-lock"></i>';label.textContent='Режим просмотра';label.style.color='';title.textContent='График работы'}}
function renderFooter(){var bar=document.getElementById('footerBar');var emp=document.getElementById('employeesBtn');var add=document.getElementById('addBudgetBtn');if(isEditMode){bar.classList.remove('hidden-bar');var onBudget=activeView==='budget';emp.style.display=onBudget?'none':'flex';add.style.display=onBudget?'flex':'none'}else bar.classList.add('hidden-bar')}
function openPicker(dateKey,shift,index){selectedSlot={dateKey:dateKey,shift:shift,index:index};var curName=(schedule[dateKey]&&schedule[dateKey][shift])?(schedule[dateKey][shift][index]||''):'';document.getElementById('clearSlotBtn').style.display=curName?'block':'none';var list=document.getElementById('pickerList');if(employees.length===0){list.innerHTML='<div class="empty-state">Список пуст. Добавьте сотрудников через кнопку внизу.</div>'}else{var items='';for(var i=0;i<employees.length;i++)items+='<button class="picker-item'+(employees[i]===curName?' is-selected':'')+'" onclick="pickEmployee('+i+')">'+escHTML(employees[i])+'</button>';list.innerHTML=items}showSheet('pickerSheet')}
function pickEmployee(empIdx){if(!selectedSlot)return;var dk=selectedSlot.dateKey,sh=selectedSlot.shift,idx=selectedSlot.index;if(!schedule[dk])schedule[dk]={morning:['',''],evening:['','']};schedule[dk][sh][idx]=employees[empIdx];saveData(function(){hideSheet('pickerSheet');renderSchedule()})}
function clearSlot(){if(!selectedSlot)return;var dk=selectedSlot.dateKey,sh=selectedSlot.shift,idx=selectedSlot.index;if(schedule[dk]&&schedule[dk][sh]){schedule[dk][sh][idx]='';saveData(function(){hideSheet('pickerSheet');renderSchedule()})}}
function openEmployeesSheet(){renderEmployeesList();document.getElementById('newEmpInput').value='';document.getElementById('newPwInput').value='';showSheet('employeesSheet');setTimeout(function(){document.getElementById('newEmpInput').focus()},350)}
function renderEmployeesList(){var list=document.getElementById('employeesList');if(employees.length===0){list.innerHTML='<div class="empty-state">Сотрудников пока нет</div>'}else{var items='';for(var i=0;i<employees.length;i++)items+='<div class="emp-item"><span>'+escHTML(employees[i])+'</span><button class="emp-del" onclick="deleteEmployee('+i+')" aria-label="Удалить"><i class="fas fa-trash-alt"></i></button></div>';list.innerHTML=items}}
function addEmployee(){var input=document.getElementById('newEmpInput');var name=input.value.trim();if(!name){showToast('Введите имя сотрудника','error');return}if(name.length<2){showToast('Слишком короткое имя','error');return}for(var i=0;i<employees.length;i++){if(employees[i].toLowerCase()===name.toLowerCase()){showToast('Такой сотрудник уже есть','error');return}}employees.push(name);saveData(function(){input.value='';renderEmployeesList();showToast('Сотрудник добавлен','success');input.focus()})}
function deleteEmployee(idx){var name=employees[idx];employees.splice(idx,1);var keys=Object.keys(schedule);for(var k=0;k<keys.length;k++){var dk=keys[k];if(!schedule[dk])continue;var shifts=['morning','evening'];for(var s=0;s<2;s++){if(!schedule[dk][shifts[s]])continue;for(var i=0;i<2;i++){if(schedule[dk][shifts[s]][i]===name)schedule[dk][shifts[s]][i]=''}}}saveData(function(){renderEmployeesList();renderSchedule();showToast(name+' удалён','success')})}
function toggleEditMode(){if(isEditMode){isEditMode=false;activeView='schedule';sessionStorage.removeItem(SS_EDIT);render();showToast('Режим просмотра','info')}else{document.getElementById('pwInput').value='';showSheet('passwordSheet');setTimeout(function(){document.getElementById('pwInput').focus()},350)}}
function submitPassword(){var input=document.getElementById('pwInput');if(input.value===getPassword()){isEditMode=true;sessionStorage.setItem(SS_EDIT,'1');hideSheet('passwordSheet');render();showToast('Открыты график и бюджет','success')}else{showToast('Неверный пароль','error');input.classList.add('shake');setTimeout(function(){input.classList.remove('shake')},450)}}
function changePassword(){var input=document.getElementById('newPwInput');var pw=input.value.trim();if(!pw){showToast('Введите новый пароль','error');return}sessionStorage.setItem('cached_pw',pw);saveData(function(){input.value='';showToast('Пароль изменён','success')})}
function setView(view){if(view==='budget'&&!isEditMode)return;activeView=view;render();window.scrollTo({top:0,behavior:'instant'})}
function monthKey(){return viewYear+'-'+String(viewMonth+1).padStart(2,'0')}
function fmtMoney(n){var neg=n<0;var v=Math.abs(Math.round(n*100)/100);var parts=v.toFixed(2).split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');var tail=parts[1]==='00'?'':','+parts[1];return (neg?'−':'')+parts[0]+tail+'\u00a0₽'}
function fmtBudgetDate(iso){var p=iso.split('-');if(p.length<3)return iso;return parseInt(p[2],10)+' '+MONTHS_GEN[parseInt(p[1],10)-1]}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function entryPay(e){return e&&e.pay==='cashless'?'cashless':'cash'}
function payTitle(pay){return pay==='cashless'?'Безналичные':'Наличные'}
function setBudgetPay(pay){budgetPay=pay==='cashless'?'cashless':'cash';var cashBtn=document.getElementById('payCash');var cardBtn=document.getElementById('payCashless');if(cashBtn)cashBtn.classList.toggle('is-active',budgetPay==='cash');if(cardBtn)cardBtn.classList.toggle('is-active',budgetPay==='cashless');if(activeView==='budget'&&isEditMode){renderBudget();renderHeader()}}
function renderBudget(){var root=document.getElementById('budgetView');var prefix=monthKey();var items=budget.filter(function(e){return e&&typeof e.date==='string'&&e.date.indexOf(prefix)===0&&entryPay(e)===budgetPay});items.sort(function(a,b){if(a.date===b.date)return a.id<b.id?1:-1;return a.date<b.date?1:-1});var income=0,expense=0;for(var i=0;i<items.length;i++){var amt=Number(items[i].amount)||0;if(items[i].type==='income')income+=amt;else expense+=amt}var balance=income-expense;var html='<div class="pay-tabs"><button type="button" class="pay-tab'+(budgetPay==='cash'?' is-active':'')+'" onclick="setBudgetPay(\'cash\')"><i class="fas fa-money-bill-wave"></i>Наличные</button><button type="button" class="pay-tab'+(budgetPay==='cashless'?' is-active':'')+'" onclick="setBudgetPay(\'cashless\')"><i class="fas fa-credit-card"></i>Безналичные</button></div>';html+='<div class="budget-summary"><div class="budget-card"><div class="lbl">Доходы</div><div class="val income">'+fmtMoney(income)+'</div></div><div class="budget-card"><div class="lbl">Расходы</div><div class="val expense">'+fmtMoney(expense)+'</div></div><div class="budget-card"><div class="lbl">Остаток</div><div class="val '+(balance<0?'expense':balance>0?'income':'')+'">'+fmtMoney(balance)+'</div></div></div><div class="budget-list">';if(items.length===0)html+='<div class="empty-state">В разделе «'+payTitle(budgetPay)+'» за этот месяц операций нет. Добавьте первую кнопкой внизу.</div>';else{for(var j=0;j<items.length;j++){var e=items[j];var kind=e.type==='income'?'income':'expense';var sign=kind==='income'?'+':'−';html+='<div class="budget-item"><div class="bi-main"><div class="bi-note">'+escHTML(e.note||(kind==='income'?'Доход':'Расход'))+'</div><div class="bi-date">'+fmtBudgetDate(e.date)+'</div></div><div class="bi-sum '+kind+'">'+sign+fmtMoney(Number(e.amount)||0)+'</div><button class="emp-del" onclick="deleteBudget(\''+escHTML(e.id)+'\')" aria-label="Удалить"><i class="fas fa-trash-alt"></i></button></div>'}}html+='</div>';root.innerHTML=html}
function setBudgetType(t){budgetType=t;document.getElementById('typeExpense').classList.toggle('is-active',t==='expense');document.getElementById('typeIncome').classList.toggle('is-active',t==='income')}
function openBudgetSheet(){document.getElementById('budgetAmount').value='';document.getElementById('budgetNote').value='';var now=new Date();var dateStr;if(viewYear===now.getFullYear()&&viewMonth===now.getMonth())dateStr=fmtDate(now);else dateStr=monthKey()+'-01';document.getElementById('budgetDate').value=dateStr;setBudgetType('expense');setBudgetPay(budgetPay);showSheet('budgetSheet');setTimeout(function(){document.getElementById('budgetAmount').focus()},350)}
function saveBudgetEntry(){var raw=document.getElementById('budgetAmount').value.replace(/\s/g,'').replace(',','.');var amount=parseFloat(raw);var date=document.getElementById('budgetDate').value;var note=document.getElementById('budgetNote').value.trim();if(!amount||amount<=0||isNaN(amount)){showToast('Введите сумму','error');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){showToast('Выберите дату','error');return}budget.push({id:newId(),date:date,type:budgetType,pay:budgetPay,amount:Math.round(amount*100)/100,note:note});var parts=date.split('-');viewYear=parseInt(parts[0],10);viewMonth=parseInt(parts[1],10)-1;saveData(function(){hideSheet('budgetSheet');render();showToast('Сохранено: '+payTitle(budgetPay).toLowerCase(),'success')})}
function deleteBudget(id){budget=budget.filter(function(e){return e.id!==id});saveData(function(){renderBudget();showToast('Операция удалена','success')})}
function refreshVisible(){renderMonthNav();if(activeView==='budget'&&isEditMode)renderBudget();else renderSchedule()}
function switchMonth(dir){if(activeSheet)return;var grid=document.getElementById(activeView==='budget'?'budgetView':'scheduleGrid');grid.classList.add('switching');setTimeout(function(){viewMonth+=dir;if(viewMonth>11){viewMonth=0;viewYear++}if(viewMonth<0){viewMonth=11;viewYear--}refreshVisible();window.scrollTo({top:0,behavior:'instant'});grid.classList.remove('switching')},180)}
function goToday(){if(activeSheet)return;var now=new Date();if(viewYear===now.getFullYear()&&viewMonth===now.getMonth()){var el=document.querySelector('.day-row.is-today');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}var grid=document.getElementById(activeView==='budget'?'budgetView':'scheduleGrid');grid.classList.add('switching');setTimeout(function(){viewYear=now.getFullYear();viewMonth=now.getMonth();refreshVisible();grid.classList.remove('switching');setTimeout(function(){var el=document.querySelector('.day-row.is-today');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},200)},180)}
function updateScrollTopBtn(){var btn=document.getElementById('scrollTopBtn');if(window.scrollY>400)btn.classList.add('visible');else btn.classList.remove('visible')}
function showSheet(id){activeSheet=id;document.getElementById(id).classList.add('active');document.body.style.overflow='hidden'}
function hideSheet(id){activeSheet=null;document.getElementById(id).classList.remove('active');document.body.style.overflow=''}
function showToast(msg,type){type=type||'info';var c=document.getElementById('toastContainer');var el=document.createElement('div');el.className='toast '+type;el.textContent=msg;c.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},300)},2200)}
function escHTML(str){var d=document.createElement('div');d.textContent=str;return d.innerHTML}
var touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX;touchStartY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',function(e){if(activeSheet)return;var dx=touchStartX-e.changedTouches[0].screenX,dy=touchStartY-e.changedTouches[0].screenY;if(Math.abs(dx)>80&&Math.abs(dy)<60)switchMonth(dx>0?1:-1)},{passive:true});
document.addEventListener('DOMContentLoaded',function(){loadData(onFirstLoad);document.getElementById('prevMonth').addEventListener('click',function(){switchMonth(-1)});document.getElementById('nextMonth').addEventListener('click',function(){switchMonth(1)});document.getElementById('todayBtn').addEventListener('click',goToday);document.getElementById('employeesBtn').addEventListener('click',openEmployeesSheet);document.getElementById('editBtn').addEventListener('click',toggleEditMode);document.getElementById('tabSchedule').addEventListener('click',function(){setView('schedule')});document.getElementById('tabBudget').addEventListener('click',function(){setView('budget')});document.getElementById('addBudgetBtn').addEventListener('click',openBudgetSheet);document.getElementById('saveBudgetBtn').addEventListener('click',saveBudgetEntry);document.getElementById('typeExpense').addEventListener('click',function(){setBudgetType('expense')});document.getElementById('typeIncome').addEventListener('click',function(){setBudgetType('income')});document.getElementById('payCash').addEventListener('click',function(){setBudgetPay('cash')});document.getElementById('payCashless').addEventListener('click',function(){setBudgetPay('cashless')});document.getElementById('budgetAmount').addEventListener('keypress',function(e){if(e.key==='Enter')saveBudgetEntry()});document.getElementById('clearSlotBtn').addEventListener('click',clearSlot);document.getElementById('addEmpBtn').addEventListener('click',addEmployee);document.getElementById('newEmpInput').addEventListener('keypress',function(e){if(e.key==='Enter')addEmployee()});document.getElementById('submitPwBtn').addEventListener('click',submitPassword);document.getElementById('pwInput').addEventListener('keypress',function(e){if(e.key==='Enter')submitPassword()});document.getElementById('changePwBtn').addEventListener('click',changePassword);var closeBtns=document.querySelectorAll('[data-close]');for(var i=0;i<closeBtns.length;i++)closeBtns[i].addEventListener('click',function(){hideSheet(this.getAttribute('data-close'))});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&activeSheet)hideSheet(activeSheet)});document.getElementById('scrollTopBtn').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});window.addEventListener('scroll',updateScrollTopBtn,{passive:true})});
</script>
</body>
</html>
