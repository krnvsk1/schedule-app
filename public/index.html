<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>График работы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        var API_URL = '/api/data';
        var SS_EDIT = 'sched_edit';
        var MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        var MONTHS_GEN = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
        var DAY_NAMES = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    </script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] }, colors: {
                bg: '#f0f1f5', card: '#ffffff', panel: '#f7f8fa',
                accent: '#c2740e', 'accent-dim': 'rgba(194,116,14,0.08)',
                fg: '#1c1f26', muted: '#9298a5', border: '#e3e5ea',
                danger: '#dc2626', success: '#16a34a',
            }}}
        }
    </script>
    <style>
        :root{--bg:#f0f1f5;--card:#fff;--panel:#f7f8fa;--accent:#c2740e;--accent-glow:rgba(194,116,14,0.07);--fg:#1c1f26;--muted:#9298a5;--border:#e3e5ea;--danger:#dc2626;--success:#16a34a;--morning:#d4880a;--morning-bg:rgba(212,136,10,0.07);--morning-border:rgba(212,136,10,0.22);--evening:#5472a8;--evening-bg:rgba(84,114,168,0.06);--evening-border:rgba(84,114,168,0.2)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:0;min-height:100dvh;overflow-x:hidden}
        body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px)}
        body::before{top:-25%;right:-20%;width:70vw;height:70vw;background:radial-gradient(circle,rgba(194,116,14,0.045)0%,transparent 70%)}
        body::after{bottom:-20%;left:-15%;width:55vw;height:55vw;background:radial-gradient(circle,rgba(84,114,168,0.035)0%,transparent 70%)}
        #app{position:relative;z-index:1}
        #loadingOverlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
        #loadingOverlay.hide{opacity:0;pointer-events:none}
        .loader{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .edit-header-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.04);flex-shrink:0}
        .edit-header-btn:active{transform:scale(.92)}
        .edit-header-btn.is-active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
        .month-nav-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .month-nav-btn:active{transform:scale(.92);background:var(--panel)}
        .grid-header{display:flex;align-items:center;gap:6px;padding:6px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:10}
        .gh-day{width:54px;flex-shrink:0}
        .gh-label{flex:1;text-align:center;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
        .gh-label.morning-label{color:var(--morning)}
        .gh-label.evening-label{color:var(--evening);margin-left:10px;padding-left:10px;border-left:1.5px solid var(--border)}
        .gh-label i{margin-right:3px;font-size:9px}
        .day-row{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:5px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:opacity .2s,border-color .2s,box-shadow .2s;border-left:3px solid transparent}
        .day-row.is-today{border-left-color:var(--accent);box-shadow:0 1px 6px rgba(194,116,14,.1);background:linear-gradient(to right,rgba(194,116,14,.03),var(--card) 40%)}
        .day-row.is-past:not(.is-today){opacity:.45}
        .dr-info{width:54px;flex-shrink:0;text-align:center}
        .dr-name{font-size:13px;font-weight:800;color:var(--fg);line-height:1.2}
        .dr-date{font-size:10px;color:var(--muted);font-weight:500;line-height:1.2;margin-top:1px}
        .dr-today-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0;animation:pulse-dot 2s ease-in-out infinite}
        @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
        .slot-group{display:flex;gap:4px;flex:1;min-width:0}
        .slot-group.evening-group{margin-left:10px;padding-left:10px;border-left:1.5px solid var(--border)}
        .slot{flex:1;min-width:0;min-height:44px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 5px;line-height:1.25;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;transition:all .15s}
        .slot.view{cursor:default;border:1px solid transparent}
        .slot.view.morning.filled{background:var(--morning-bg);color:var(--fg);border-color:var(--morning-border)}
        .slot.view.evening.filled{background:var(--evening-bg);color:var(--fg);border-color:var(--evening-border)}
        .slot.view.empty{color:var(--muted);opacity:.35;font-size:13px}
        .slot.edit{cursor:pointer;border:1.5px dashed var(--border);background:transparent;color:var(--muted)}
        .slot.edit:active{transform:scale(.95)}
        .slot.edit.morning.filled{border-style:solid;border-color:var(--morning-border);background:var(--morning-bg);color:var(--fg)}
        .slot.edit.evening.filled{border-style:solid;border-color:var(--evening-border);background:var(--evening-bg);color:var(--fg)}
        .slot.edit.empty i{font-size:10px}
        .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
        .sheet-panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:12px 20px 28px;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:101;max-height:75vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,.08)}
        .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
        .bottom-sheet.active .sheet-overlay{opacity:1;pointer-events:auto}
        .bottom-sheet.active .sheet-panel{transform:translateY(0)}
        .picker-item{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--fg);font-size:14px;font-weight:500;text-align:left;cursor:pointer;transition:all .15s;font-family:inherit;display:block;margin-bottom:6px}
        .picker-item:active{transform:scale(.98)}
        .picker-item.is-selected{border-color:var(--accent);background:var(--accent-glow);color:var(--accent);font-weight:600}
        .emp-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);margin-bottom:6px}
        .emp-item span{font-size:14px;font-weight:500}
        .emp-del{width:34px;height:34px;border-radius:8px;border:none;background:rgba(220,38,38,.06);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;flex-shrink:0}
        .emp-del:active{transform:scale(.9);background:rgba(220,38,38,.15)}
        .btn-primary{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
        .btn-primary:active{transform:scale(.97);opacity:.85}
        .btn-secondary{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
        .btn-secondary:active{transform:scale(.97);background:var(--panel)}
        .btn-danger-outline{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(220,38,38,.2);background:rgba(220,38,38,.04);color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
        .btn-danger-outline:active{transform:scale(.97);background:rgba(220,38,38,.1)}
        .input-field{width:100%;padding:14px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel);color:var(--fg);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
        .input-field::placeholder{color:var(--muted)}
        .input-field:focus{border-color:var(--accent)}
        .footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:50;display:flex;justify-content:center;gap:8px;transition:transform .3s,opacity .3s}
        .footer-bar.hidden-bar{transform:translateY(100%);opacity:0;pointer-events:none}
        .footer-btn-single{padding:11px 32px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .footer-btn-single i{font-size:14px;color:var(--accent)}
        .footer-btn-single:active{transform:scale(.95)}
        .toast-container{position:fixed;top:16px;left:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:auto;box-shadow:0 4px 15px rgba(0,0,0,.08)}
        .toast.show{opacity:1;transform:translateY(0)}
        .toast.success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
        .toast.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
        .toast.info{background:#fffbeb;color:var(--accent);border:1px solid #fde68a}
        .empty-state{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px}
        #scheduleGrid,#budgetView{transition:opacity .18s ease,transform .18s ease}
        #scheduleGrid.switching,#budgetView.switching{opacity:0;transform:translateY(6px)}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
        .shake{animation:shake .4s ease}
        .divider{height:1px;background:var(--border);margin:16px 0}
        .scroll-top-btn{position:fixed;bottom:78px;right:14px;width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--fg);border:1px solid var(--border);cursor:pointer;z-index:45;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
        .scroll-top-btn.visible{opacity:1;transform:translateY(0);pointer-events:auto}
        .scroll-top-btn:active{transform:scale(.9)}
        .section-tabs{display:none;gap:4px;margin:0 16px 12px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .section-tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:10px 8px;border-radius:9px;cursor:pointer;transition:all .15s}
        .section-tab:active{transform:scale(.97)}
        .section-tab.is-active{background:var(--accent);color:#fff}
        .section-tab i,.pay-tab i{margin-right:6px}
        .pay-tabs{display:none;gap:4px;margin:0 16px 12px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
        .pay-tabs.is-on{display:flex}
        .pay-tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:9px;cursor:pointer;transition:all .15s}
        .pay-tab:active{transform:scale(.97)}
        .pay-tab.is-active{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.06)}
        .budget-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 12px}
        .budget-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .budget-card .lbl{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
        .budget-card .val{font-size:14px;font-weight:800;margin-top:4px;line-height:1.2;word-break:break-word}
        .budget-card .val.income{color:var(--success)}
        .budget-card .val.expense{color:var(--danger)}
        .budget-list{padding:0 16px}
        .budget-tools{display:none;gap:8px;padding:0 16px 12px}
        .budget-tools.is-on{display:flex}
        .budget-tools .input-field{padding:11px 12px}
        #budgetSearch{flex:1;min-width:0}
        .period-btn{width:auto;max-width:48%;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--fg)}
        .period-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .period-btn i{color:var(--accent);flex-shrink:0}
        .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
        .cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
        .cal-weekdays span{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
        .cal-day{height:40px;border:none;border-radius:10px;background:transparent;font-family:inherit;font-weight:700;font-size:13px;color:var(--fg);cursor:pointer}
        .cal-day.is-out{visibility:hidden;pointer-events:none}
        .cal-day.is-range{background:var(--accent-glow);border-radius:0}
        .cal-day.is-start,.cal-day.is-end{background:var(--accent);color:#fff}
        .cal-day.is-start:not(.is-end){border-radius:10px 0 0 10px}
        .cal-day.is-end:not(.is-start){border-radius:0 10px 10px 0}
        #addIncomeBtn,#addExpenseBtn{flex:1;justify-content:center}
        #addIncomeBtn i{color:var(--success)}
        #addExpenseBtn i{color:var(--danger)}
        .budget-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
        .budget-item:active{transform:scale(.99)}
        .budget-item .bi-main{flex:1;min-width:0}
        .emp-edit{width:34px;height:34px;border-radius:8px;border:none;background:var(--accent-glow);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;flex-shrink:0}
        .emp-edit:active{transform:scale(.9)}
        .budget-item .bi-note{font-size:14px;font-weight:600;color:var(--fg);line-height:1.3}
        .budget-item .bi-date{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
        .budget-item .bi-sum{font-size:14px;font-weight:800;white-space:nowrap}
        .budget-item .bi-sum.income{color:var(--success)}
        .budget-item .bi-sum.expense{color:var(--danger)}
        .day-block{margin:0 16px 14px}
        .day-head{font-size:13px;font-weight:800;margin:0 0 8px}
        .day-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
        .col-heads{margin:0 16px 8px}
        .col-label{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
        .col-label.income{color:var(--success)}
        .col-label.expense{color:var(--danger)}
        .col-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:6px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .col-item:active{transform:scale(.98)}
        .col-top{display:flex;align-items:flex-start;gap:4px}
        .col-note{flex:1;min-width:0;font-size:12px;font-weight:600;line-height:1.3;word-break:break-word}
        .col-cat{font-size:10px;color:var(--muted);margin-top:2px}
        .col-sum{font-size:13px;font-weight:800;margin-top:4px}
        .col-sum.income{color:var(--success)}
        .col-sum.expense{color:var(--danger)}
        .col-item .emp-del{width:26px;height:26px}
        .col-empty{min-height:8px}
        .type-toggle{display:flex;gap:6px}
        .type-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
        .type-btn.is-income.is-active{border-color:var(--success);background:rgba(22,163,74,.08);color:var(--success)}
        .type-btn.is-expense.is-active{border-color:var(--danger);background:rgba(220,38,38,.06);color:var(--danger)}
        .type-btn.is-pay.is-active{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}
        .type-drop{position:relative;margin-bottom:8px}
        .type-drop-btn{display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;font-weight:600}
        .type-drop-btn i{color:var(--muted);font-size:12px}
        .type-drop-menu{display:none;margin-top:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}
        .type-drop.is-open .type-drop-menu{display:block}
        .type-drop-list{max-height:180px;overflow-y:auto}
        .type-opt{width:100%;text-align:left;border:none;background:transparent;padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;color:var(--fg);cursor:pointer}
        .type-opt.is-selected{background:var(--accent-glow);color:var(--accent)}
        .type-drop-add{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border);background:var(--panel)}
        .type-drop-add .input-field{padding:10px 12px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.05ms!important}}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    </style>
</head>
<body>
<div id="loadingOverlay"><div class="loader"></div><p class="text-sm font-semibold text-muted mt-4">Загрузка графика...</p></div>
<div id="app" style="opacity:0;transition:opacity .4s">
    <header class="flex items-center justify-between px-4 pt-5 pb-2">
        <div><h1 id="pageTitle" class="text-lg font-extrabold tracking-tight text-fg">График работы</h1><p id="modeLabel" class="text-[11px] font-semibold text-muted mt-0.5">Режим просмотра</p></div>
        <button class="edit-header-btn" id="editBtn" aria-label="Редактирование" title="Редактирование"><i class="fas fa-lock"></i></button>
    </header>
    <div class="section-tabs" id="sectionTabs">
        <button type="button" class="section-tab is-active" id="tabSchedule"><i class="fas fa-calendar-days"></i> График</button>
        <button type="button" class="section-tab" id="tabBudget"><i class="fas fa-wallet"></i> Бюджет</button>
    </div>
    <nav class="flex items-center justify-between px-4 mb-3">
        <button class="month-nav-btn" id="prevMonth" aria-label="Предыдущий месяц"><i class="fas fa-chevron-left"></i></button>
        <div class="text-center"><span id="monthLabel" class="text-sm font-bold text-fg"></span><button id="todayBtn" class="block mx-auto mt-1 text-[11px] font-bold text-accent bg-accent-dim px-3 py-1 rounded-full border border-transparent hover:border-accent/30 transition-all">Текущий месяц</button></div>
        <button class="month-nav-btn" id="nextMonth" aria-label="Следующий месяц"><i class="fas fa-chevron-right"></i></button>
    </nav>
    <div class="pay-tabs" id="payTabs">
        <button type="button" class="pay-tab is-active" id="tabPayCash"><i class="fas fa-money-bill-wave"></i>Наличные</button>
        <button type="button" class="pay-tab" id="tabPayCashless"><i class="fas fa-credit-card"></i>Безналичные</button>
    </div>
    <div class="budget-tools" id="budgetTools">
        <input type="search" class="input-field" id="budgetSearch" placeholder="Поиск по комментарию" maxlength="80" autocomplete="off">
        <button type="button" class="input-field period-btn" id="budgetPeriodBtn" aria-label="Период"><i class="fas fa-calendar-days"></i><span id="budgetPeriodLabel">Все дни</span></button>

<div class="toast-container" id="toastContainer"></div>
<script>
var employees=[],schedule={},budget=[],cashTypes={income:[],expense:[]},cashlessTypes={income:[],expense:[]},cashlessTypeValue='',isEditMode=false,activeView='schedule',budgetType='income',budgetPay='cash',budgetQuery='',budgetFrom='',budgetTo='',pickFrom='',pickTo='',calYear,calMonth,editingBudgetId=null,viewYear,viewMonth,activeSheet=null,selectedSlot=null,savingLock=false;
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function getWeekday(d){var w=d.getDay();return w===0?6:w-1}
function normalizeTypeList(list){var out=[];if(!Array.isArray(list))return out;for(var i=0;i<list.length;i++){var name=String(list[i]||'').trim();if(!name)continue;var exists=false;for(var j=0;j<out.length;j++){if(out[j].toLowerCase()===name.toLowerCase())exists=true}if(!exists)out.push(name)}return out}
function ensureCashlessType(list,name){for(var i=0;i<list.length;i++){if(list[i].toLowerCase()===name.toLowerCase())return list}list.unshift(name);return list}
function capType(name){var s=String(name||'').trim();if(!s)return '';var known={'снятие со счета':'Снятие со счета','доставка':'Доставка','зарплата':'Зарплата','лаваш':'Лаваш','переводы':'Переводы','пополнение счета':'Пополнение счета','приложение кума шаурма':'Приложение Кума Шаурма','оплата кредита':'Оплата кредита'};if(known[s.toLowerCase()])return known[s.toLowerCase()];return s.charAt(0).toUpperCase()+s.slice(1)}
function seedTypeList(saved,defaults){var raw=normalizeTypeList(saved);var list=[];for(var n=0;n<raw.length;n++){var titled=capType(raw[n]);if(!titled)continue;var dup=false;for(var j=0;j<list.length;j++){if(list[j].toLowerCase()===titled.toLowerCase())dup=true}if(!dup)list.push(titled)}for(var i=defaults.length-1;i>=0;i--)ensureCashlessType(list,defaults[i]);return list}
function dropType(list,name){var key=name.toLowerCase();var out=[];for(var i=0;i<list.length;i++){if(list[i].toLowerCase()!==key)out.push(list[i])}return out}
function loadData(cb){fetch(API_URL).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(data){employees=data.employees||[];schedule=data.schedule||{};budget=Array.isArray(data.budget)?data.budget:[];var cashSaved=data.cashTypes||{};var cardSaved=data.cashlessTypes||{};cashTypes={income:dropType(dropType(seedTypeList(cashSaved.income,['Снятие со счета']),'доставка'),'перевод на счет'),expense:dropType(seedTypeList(cashSaved.expense,['Доставка','Зарплата','Лаваш','Переводы','Пополнение счета']),'перевод на счет')};cashlessTypes={income:dropType(seedTypeList(cardSaved.income,['Приложение Кума Шаурма','Переводы','Пополнение счета']),'перевод на счет'),expense:dropType(seedTypeList(cardSaved.expense,['Приложение Кума Шаурма','Снятие со счета','Оплата кредита']),'перевод на счет')};for(var bi=0;bi<budget.length;bi++){if(budget[bi]&&budget[bi].category)budget[bi].category=capType(budget[bi].category)}cb()}).catch(function(){showToast('Ошибка загрузки данных','error');cb()})}
function saveData(cb,extra){if(savingLock)return;savingLock=true;var payload={employees:employees,schedule:schedule,budget:budget,cashTypes:cashTypes,cashlessTypes:cashlessTypes,password:getPassword()};if(extra&&extra.newPassword)payload.newPassword=extra.newPassword;fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){if(r.status===401){savingLock=false;showToast('Неверный пароль','error');return}if(!r.ok)throw new Error();savingLock=false;if(cb)cb()}).catch(function(){savingLock=false;showToast('Ошибка сохранения','error')})}
function getPassword(){return sessionStorage.getItem('cached_pw')||''}
function onFirstLoad(){document.getElementById('loadingOverlay').classList.add('hide');setTimeout(function(){document.getElementById('loadingOverlay').style.display='none'},400);document.getElementById('app').style.opacity='1';isEditMode=sessionStorage.getItem(SS_EDIT)==='1'&&!!sessionStorage.getItem('cached_pw');if(!sessionStorage.getItem('cached_pw'))sessionStorage.removeItem(SS_EDIT);var now=new Date();viewYear=now.getFullYear();viewMonth=now.getMonth();render();setTimeout(function(){var el=document.querySelector('.day-row.is-today');if(el)el.scrollIntoView({behavior:'instant',block:'center'})},50)}
function render(){renderMonthNav();var onBudget=activeView==='budget'&&isEditMode;document.getElementById('budgetTools').classList.toggle('is-on',onBudget);document.getElementById('payTabs').classList.toggle('is-on',onBudget);if(onBudget){document.getElementById('scheduleGrid').style.display='none';document.getElementById('budgetView').style.display='block';updatePeriodLabel();renderBudget()}else{activeView='schedule';document.getElementById('budgetView').style.display='none';document.getElementById('scheduleGrid').style.display='';renderSchedule()}renderTabs();renderHeader();renderFooter()}
function renderTabs(){var tabs=document.getElementById('sectionTabs');tabs.style.display=isEditMode?'flex':'none';document.getElementById('tabSchedule').classList.toggle('is-active',activeView!=='budget');document.getElementById('tabBudget').classList.toggle('is-active',activeView==='budget')}
function renderMonthNav(){document.getElementById('monthLabel').textContent=MONTHS_FULL[viewMonth]+' '+viewYear}
function renderSchedule(){var grid=document.getElementById('scheduleGrid');if(!grid)return;var daysCount=getDaysInMonth(viewYear,viewMonth);var todayStr=fmtDate(new Date());var todayDate=new Date();todayDate.setHours(0,0,0,0);var html='<div class="grid-header"><div class="gh-day"></div><div class="gh-label morning-label"><i class="fas fa-sun"></i> 8:00\u201315:30</div><div class="gh-label evening-label"><i class="fas fa-moon"></i> 15:30\u201323:00</div></div>';for(var day=1;day<=daysCount;day++){var d=new Date(viewYear,viewMonth,day);var dk=fmtDate(d);var isToday=dk===todayStr;d.setHours(0,0,0,0);var isPast=d<todayDate;var weekday=getWeekday(d);var ds=schedule[dk]||{morning:['',''],evening:['','']};var cls='day-row';if(isToday)cls+=' is-today';else if(isPast)cls+=' is-past';html+='<div class="'+cls+'"><div class="dr-info"><div class="dr-name">'+DAY_NAMES[weekday]+'</div><div class="dr-date">'+day+' '+MONTHS_GEN[viewMonth]+'</div>';html+=isToday?'<div class="dr-today-dot"></div>':'<div style="height:5px"></div>';html+='</div><div class="slot-group">';html+=slotHTML(dk,'morning',0,ds.morning[0])+slotHTML(dk,'morning',1,ds.morning[1]);html+='</div><div class="slot-group evening-group">';html+=slotHTML(dk,'evening',0,ds.evening[0])+slotHTML(dk,'evening',1,ds.evening[1]);html+='</div></div>'}grid.innerHTML=html}
function slotHTML(dk,shift,idx,value){var cls=value?'filled':'empty';var mode=isEditMode?'edit':'view';if(isEditMode)return '<button class="slot '+mode+' '+shift+' '+cls+'" onclick="openPicker(\''+dk+'\',\''+shift+'\','+idx+')">'+(value||'<i class="fas fa-plus"></i>')+'</button>';return '<div class="slot '+mode+' '+shift+' '+cls+'">'+(value||'\u2014')+'</div>'}
function renderHeader(){var btn=document.getElementById('editBtn');var label=document.getElementById('modeLabel');var title=document.getElementById('pageTitle');if(isEditMode){btn.classList.add('is-active');btn.innerHTML='<i class="fas fa-lock-open"></i>';label.textContent=activeView==='budget'?(budgetPay==='cashless'?'Безналичные':'Наличные'):'Режим редактирования';label.style.color='var(--accent)';title.textContent=activeView==='budget'?'Бюджет':'График работы'}else{btn.classList.remove('is-active');btn.innerHTML='<i class="fas fa-lock"></i>';label.textContent='Режим просмотра';label.style.color='';title.textContent='График работы'}}
function renderFooter(){var bar=document.getElementById('footerBar');var onBudget=isEditMode&&activeView==='budget';if(isEditMode)bar.classList.remove('hidden-bar');else bar.classList.add('hidden-bar');document.getElementById('employeesBtn').style.display=onBudget?'none':'flex';document.getElementById('addIncomeBtn').style.display=onBudget?'flex':'none';document.getElementById('addExpenseBtn').style.display=onBudget?'flex':'none'}
function openPicker(dateKey,shift,index){selectedSlot={dateKey:dateKey,shift:shift,index:index};var curName=(schedule[dateKey]&&schedule[dateKey][shift])?(schedule[dateKey][shift][index]||''):'';document.getElementById('clearSlotBtn').style.display=curName?'block':'none';var list=document.getElementById('pickerList');if(employees.length===0){list.innerHTML='<div class="empty-state">Список пуст. Добавьте сотрудников через кнопку внизу.</div>'}else{var items='';for(var i=0;i<employees.length;i++)items+='<button class="picker-item'+(employees[i]===curName?' is-selected':'')+'" onclick="pickEmployee('+i+')">'+escHTML(employees[i])+'</button>';list.innerHTML=items}showSheet('pickerSheet')}
function pickEmployee(empIdx){if(!selectedSlot)return;var dk=selectedSlot.dateKey,sh=selectedSlot.shift,idx=selectedSlot.index;if(!schedule[dk])schedule[dk]={morning:['',''],evening:['','']};schedule[dk][sh][idx]=employees[empIdx];saveData(function(){hideSheet('pickerSheet');renderSchedule()})}
function clearSlot(){if(!selectedSlot)return;var dk=selectedSlot.dateKey,sh=selectedSlot.shift,idx=selectedSlot.index;if(schedule[dk]&&schedule[dk][sh]){schedule[dk][sh][idx]='';saveData(function(){hideSheet('pickerSheet');renderSchedule()})}}
function openEmployeesSheet(){renderEmployeesList();document.getElementById('newEmpInput').value='';document.getElementById('newPwInput').value='';showSheet('employeesSheet');setTimeout(function(){document.getElementById('newEmpInput').focus()},350)}
function renderEmployeesList(){var list=document.getElementById('employeesList');if(employees.length===0){list.innerHTML='<div class="empty-state">Сотрудников пока нет</div>'}else{var items='';for(var i=0;i<employees.length;i++)items+='<div class="emp-item"><span>'+escHTML(employees[i])+'</span><button class="emp-del" onclick="deleteEmployee('+i+')" aria-label="Удалить"><i class="fas fa-trash-alt"></i></button></div>';list.innerHTML=items}}
function addEmployee(){var input=document.getElementById('newEmpInput');var name=input.value.trim();if(!name){showToast('Введите имя сотрудника','error');return}if(name.length<2){showToast('Слишком короткое имя','error');return}for(var i=0;i<employees.length;i++){if(employees[i].toLowerCase()===name.toLowerCase()){showToast('Такой сотрудник уже есть','error');return}}employees.push(name);saveData(function(){input.value='';renderEmployeesList();showToast('Сотрудник добавлен','success');input.focus()})}
function deleteEmployee(idx){var name=employees[idx];employees.splice(idx,1);var keys=Object.keys(schedule);for(var k=0;k<keys.length;k++){var dk=keys[k];if(!schedule[dk])continue;var shifts=['morning','evening'];for(var s=0;s<2;s++){if(!schedule[dk][shifts[s]])continue;for(var i=0;i<2;i++){if(schedule[dk][shifts[s]][i]===name)schedule[dk][shifts[s]][i]=''}}}saveData(function(){renderEmployeesList();renderSchedule();showToast(name+' удалён','success')})}
function toggleEditMode(){if(isEditMode){isEditMode=false;activeView='schedule';sessionStorage.removeItem(SS_EDIT);render();showToast('Режим просмотра','info')}else{document.getElementById('pwInput').value='';showSheet('passwordSheet');setTimeout(function(){document.getElementById('pwInput').focus()},350)}}
function submitPassword(){var input=document.getElementById('pwInput');var pw=input.value.trim();fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){return r.text().then(function(text){var data=null;try{data=JSON.parse(text)}catch(e){}if(!data||typeof data.ok!=='boolean')throw new Error('bad');return {ok:r.ok&&data.ok}})}).then(function(res){if(res.ok){sessionStorage.setItem('cached_pw',pw);isEditMode=true;sessionStorage.setItem(SS_EDIT,'1');hideSheet('passwordSheet');render();showToast('Открыты график и бюджет','success')}else{showToast('Неверный пароль','error');input.classList.add('shake');setTimeout(function(){input.classList.remove('shake')},450)}}).catch(function(){showToast('Перезапустите сервер: npm start','error')})}
function changePassword(){var input=document.getElementById('newPwInput');var pw=input.value.trim();if(!pw){showToast('Введите новый пароль','error');return}saveData(function(){sessionStorage.setItem('cached_pw',pw);input.value='';showToast('Пароль изменён','success')},{newPassword:pw})}
function setView(view){if(view==='budget'&&!isEditMode)return;activeView=view;render();window.scrollTo({top:0,behavior:'instant'})}
function monthKey(){return viewYear+'-'+String(viewMonth+1).padStart(2,'0')}
function fmtMoney(n){var neg=n<0;var v=Math.abs(Math.round(n*100)/100);var parts=v.toFixed(2).split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');var tail=parts[1]==='00'?'':','+parts[1];return (neg?'−':'')+parts[0]+tail+'\u00a0₽'}
function fmtBudgetDate(iso){var p=iso.split('-');if(p.length<3)return iso;return parseInt(p[2],10)+' '+MONTHS_GEN[parseInt(p[1],10)-1]}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function entryPay(e){return e&&e.pay==='cashless'?'cashless':'cash'}
function payTitle(pay){return pay==='cashless'?'Безналичные':'Наличные'}
function setBudgetPay(pay){budgetPay=pay==='cashless'?'cashless':'cash';var ids=[['payCash','cash'],['tabPayCash','cash'],['payCashless','cashless'],['tabPayCashless','cashless']];for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i][0]);if(el)el.classList.toggle('is-active',budgetPay===ids[i][1])}if(activeView==='budget'&&isEditMode){renderBudget();renderHeader()}syncCashlessTypeField()}
function isoDate(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function inBudgetRange(date){if(budgetFrom&&budgetTo)return date>=budgetFrom&&date<=budgetTo;return date.indexOf(monthKey())===0}
function periodText(from,to){if(!from)return 'Все дни';if(!to||from===to)return fmtBudgetDate(from);var a=from.split('-'),b=to.split('-');if(a[0]===b[0]&&a[1]===b[1])return parseInt(a[2],10)+'–'+parseInt(b[2],10)+' '+MONTHS_GEN[parseInt(a[1],10)-1];return fmtBudgetDate(from)+' – '+fmtBudgetDate(to)}
function updatePeriodLabel(){document.getElementById('budgetPeriodLabel').textContent=periodText(budgetFrom,budgetTo)}
function renderBudget(){var root=document.getElementById('budgetView');var q=budgetQuery;var items=budget.filter(function(e){if(!e||typeof e.date!=='string'||entryPay(e)!==budgetPay||!inBudgetRange(e.date))return false;if(q&&(String(e.note||'')+' '+String(e.category||'')).toLowerCase().indexOf(q)===-1)return false;return true});items.sort(function(a,b){if(a.date===b.date)return a.id<b.id?1:-1;return a.date<b.date?1:-1});var income=0,expense=0;for(var i=0;i<items.length;i++){var amt=Number(items[i].amount)||0;if(items[i].type==='income')income+=amt;else expense+=amt}var balance=income-expense;var html='<div class="budget-summary"><div class="budget-card"><div class="lbl">Доходы</div><div class="val income">'+fmtMoney(income)+'</div></div><div class="budget-card"><div class="lbl">Расходы</div><div class="val expense">'+fmtMoney(expense)+'</div></div><div class="budget-card"><div class="lbl">Остаток</div><div class="val '+(balance<0?'expense':balance>0?'income':'')+'">'+fmtMoney(balance)+'</div></div></div><div class="budget-list">';if(items.length===0){html+=budgetQuery||budgetFrom?'<div class="empty-state">Ничего не найдено</div>':'<div class="empty-state">В разделе «'+payTitle(budgetPay)+'» за этот месяц операций нет. Добавьте доход или расход кнопками внизу.</div>'}else{html+='<div class="day-cols col-heads"><div class="col-label income">Доходы</div><div class="col-label expense">Расходы</div></div>';var groups=[],seen={};for(var j=0;j<items.length;j++){var day=items[j].date;if(!seen[day]){seen[day]={date:day,income:[],expense:[]};groups.push(seen[day])}if(items[j].type==='income')seen[day].income.push(items[j]);else seen[day].expense.push(items[j])}for(var g=0;g<groups.length;g++){var group=groups[g];html+='<div class="day-block"><div class="day-head">'+fmtBudgetDate(group.date)+'</div><div class="day-cols"><div>'+budgetColumn(group.income)+'</div><div>'+budgetColumn(group.expense)+'</div></div></div>'}}html+='</div>';root.innerHTML=html}
function budgetColumn(list){if(!list.length)return '<div class="col-empty"></div>';var html='';for(var i=0;i<list.length;i++){var e=list[i];var kind=e.type==='income'?'income':'expense';var eid=jsAttr(e.id);var cat=e.category?'<div class="col-cat">'+escHTML(e.category)+'</div>':'';html+='<div class="col-item" onclick="editBudget(\''+eid+'\')"><div class="col-top"><div class="col-note">'+escHTML(e.note||(kind==='income'?'Доход':'Расход'))+'</div><button type="button" class="emp-del" onclick="event.stopPropagation();deleteBudget(\''+eid+'\')" aria-label="Удалить"><i class="fas fa-trash-alt"></i></button></div>'+cat+'<div class="col-sum '+kind+'">'+(kind==='income'?'+':'−')+fmtMoney(Number(e.amount)||0)+'</div></div>'}return html}
function renderCalendar(){document.getElementById('calLabel').textContent=MONTHS_FULL[calMonth]+' '+calYear;var lead=getWeekday(new Date(calYear,calMonth,1));var days=getDaysInMonth(calYear,calMonth);var html='';for(var i=0;i<lead;i++)html+='<div class="cal-day is-out"></div>';for(var d=1;d<=days;d++){var iso=isoDate(calYear,calMonth,d);var cls='cal-day';if(pickFrom&&pickTo&&iso>=pickFrom&&iso<=pickTo)cls+=' is-range';if(iso===pickFrom)cls+=' is-start';if(iso===pickTo)cls+=' is-end';html+='<button type="button" class="'+cls+'" onclick="pickCalDay(\''+iso+'\')">'+d+'</button>'}document.getElementById('calGrid').innerHTML=html;var hint=document.getElementById('periodHint');if(!pickFrom)hint.textContent='Нажмите день начала, затем день конца';else if(pickFrom===pickTo)hint.textContent=fmtBudgetDate(pickFrom)+'. Нажмите второй день или «Показать»';else hint.textContent=periodText(pickFrom,pickTo)}
function shiftCal(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function pickCalDay(iso){if(!pickFrom||(pickTo&&pickFrom!==pickTo)){pickFrom=iso;pickTo=iso}else if(iso<pickFrom){pickTo=pickFrom;pickFrom=iso}else pickTo=iso;renderCalendar()}
function openPeriodSheet(){pickFrom=budgetFrom||'';pickTo=budgetTo||budgetFrom||'';if(budgetFrom){var p=budgetFrom.split('-');calYear=parseInt(p[0],10);calMonth=parseInt(p[1],10)-1}else{calYear=viewYear;calMonth=viewMonth}renderCalendar();showSheet('periodSheet')}
function applyPeriod(){if(!pickFrom){showToast('Выберите день','error');return}budgetFrom=pickFrom;budgetTo=pickTo||pickFrom;if(budgetTo<budgetFrom){var swap=budgetFrom;budgetFrom=budgetTo;budgetTo=swap}hideSheet('periodSheet');updatePeriodLabel();renderBudget()}
function clearPeriod(){budgetFrom='';budgetTo='';pickFrom='';pickTo='';hideSheet('periodSheet');updatePeriodLabel();renderBudget()}
function setBudgetType(t){budgetType=t==='expense'?'expense':'income';document.getElementById('typeExpense').classList.toggle('is-active',budgetType==='expense');document.getElementById('typeIncome').classList.toggle('is-active',budgetType==='income');syncCashlessTypeField()}
function cashlessTypeKey(){return budgetType==='expense'?'expense':'income'}
function activeTypeList(){return (budgetPay==='cashless'?cashlessTypes:cashTypes)[cashlessTypeKey()]}
function syncCashlessTypeField(selected){var box=document.getElementById('cashlessTypeBox');box.style.display='block';document.getElementById('cashlessTypeLabel').textContent=budgetType==='expense'?'Тип расхода':'Тип дохода';var list=activeTypeList();if(selected!==undefined)cashlessTypeValue=selected&&list.indexOf(selected)>=0?selected:'';else if(list.indexOf(cashlessTypeValue)<0)cashlessTypeValue='';document.getElementById('typeDropLabel').textContent=cashlessTypeValue||'Без типа';var html='<button type="button" class="type-opt'+(!cashlessTypeValue?' is-selected':'')+'" data-type="">Без типа</button>';for(var i=0;i<list.length;i++)html+='<button type="button" class="type-opt'+(list[i]===cashlessTypeValue?' is-selected':'')+'" data-type="'+escHTML(list[i])+'">'+escHTML(list[i])+'</button>';document.getElementById('typeDropList').innerHTML=html}
function addCashlessType(){var input=document.getElementById('newCashlessType');var name=capType(input.value);if(name.length<2){showToast('Введите тип','error');return}var list=activeTypeList();for(var i=0;i<list.length;i++){if(list[i].toLowerCase()===name.toLowerCase()){syncCashlessTypeField(list[i]);input.value='';showToast('Такой тип уже есть','info');return}}list.push(name);saveData(function(){syncCashlessTypeField(name);input.value='';document.getElementById('typeDrop').classList.remove('is-open');showToast('Тип добавлен','success')})}
function selectedCashlessType(){return cashlessTypeValue||''}
function mirrorOp(pay,category){var name=String(category||'').trim().toLowerCase();if(pay==='cash'&&budgetType==='income'&&name==='снятие со счета')return {pay:'cashless',type:'expense'};if(pay==='cash'&&(name==='переводы'||name==='пополнение счета'))return {pay:'cashless',type:'income'};if(pay==='cashless'&&budgetType==='income'&&name==='пополнение счета')return {pay:'cash',type:'expense'};if(pay==='cashless'&&name==='снятие со счета')return {pay:'cash',type:'income'};return null}
function findBudget(id){for(var i=0;i<budget.length;i++){if(budget[i]&&budget[i].id===id)return budget[i]}return null}
function amountToInput(n){var v=Math.round(Number(n)*100)/100;if(!isFinite(v))return '';return String(v).replace('.',',')}
function defaultBudgetDate(){var now=new Date();if(budgetFrom&&budgetFrom===budgetTo)return budgetFrom;if(viewYear===now.getFullYear()&&viewMonth===now.getMonth())return fmtDate(now);return monthKey()+'-01'}
function showBudgetKinds(show){document.getElementById('budgetKindToggles').style.display=show?'block':'none'}
function openBudgetSheet(kind){editingBudgetId=null;document.getElementById('budgetSheetTitle').textContent=kind==='expense'?'Новый расход':'Новый доход';document.getElementById('budgetAmount').value='';document.getElementById('budgetNote').value='';document.getElementById('budgetDate').value=defaultBudgetDate();setBudgetType(kind==='expense'?'expense':'income');showBudgetKinds(false);syncCashlessTypeField('');showSheet('budgetSheet');setTimeout(function(){document.getElementById('budgetAmount').focus()},350)}
function editBudget(id){var e=findBudget(id);if(!e)return;editingBudgetId=id;document.getElementById('budgetSheetTitle').textContent='Редактирование';document.getElementById('budgetAmount').value=amountToInput(e.amount);document.getElementById('budgetNote').value=e.note||'';document.getElementById('budgetDate').value=e.date||'';setBudgetType(e.type==='expense'?'expense':'income');setBudgetPay(entryPay(e));showBudgetKinds(true);syncCashlessTypeField(e.category||'');showSheet('budgetSheet');setTimeout(function(){document.getElementById('budgetAmount').focus()},350)}
function isKumaIncome(category){return budgetType==='income'&&budgetPay==='cashless'&&String(category||'').trim().toLowerCase()==='приложение кума шаурма'}
function saveBudgetEntry(){var raw=document.getElementById('budgetAmount').value.replace(/\s/g,'').replace(',','.');var amount=parseFloat(raw);var date=document.getElementById('budgetDate').value;var note=document.getElementById('budgetNote').value.trim();if(!amount||amount<=0||isNaN(amount)){showToast('Введите сумму','error');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){showToast('Выберите дату','error');return}var rounded=Math.round(amount*100)/100;var wasEdit=!!editingBudgetId;var category=selectedCashlessType();var fee=0;var mirrored='';if(wasEdit){var current=findBudget(editingBudgetId);if(!current){showToast('Операция не найдена','error');return}current.date=date;current.type=budgetType;current.pay=budgetPay;current.amount=rounded;current.note=note;current.category=category}else{budget.push({id:newId(),date:date,type:budgetType,pay:budgetPay,amount:rounded,note:note,category:category});if(isKumaIncome(category)){fee=Math.round(rounded*0.0465*100)/100;if(fee>=0.01){ensureCashlessType(cashlessTypes.expense,'Приложение Кума Шаурма');budget.push({id:newId(),date:date,type:'expense',pay:'cashless',amount:fee,note:'Комиссия 4,65%',category:'Приложение Кума Шаурма'})}}mirrored=mirrorOp(budgetPay,category);if(mirrored){ensureCashlessType((mirrored.pay==='cash'?cashTypes:cashlessTypes)[mirrored.type==='expense'?'expense':'income'],category);budget.push({id:newId(),date:date,type:mirrored.type,pay:mirrored.pay,amount:rounded,note:note||category,category:category})}}var parts=date.split('-');viewYear=parseInt(parts[0],10);viewMonth=parseInt(parts[1],10)-1;editingBudgetId=null;var toast=wasEdit?'Операция изменена':fee?'Сохранено, комиссия '+fmtMoney(fee):mirrored&&mirrored.pay==='cashless'&&mirrored.type==='expense'?'Сохранено, расход в безнале':mirrored&&mirrored.pay==='cashless'?'Сохранено, приход в безнале':mirrored&&mirrored.pay==='cash'&&mirrored.type==='expense'?'Сохранено, расход в наличке':mirrored&&mirrored.pay==='cash'?'Сохранено, приход в наличке':'Сохранено: '+payTitle(budgetPay).toLowerCase();saveData(function(){hideSheet('budgetSheet');render();showToast(toast,'success')})}
function deleteBudget(id){budget=budget.filter(function(e){return e.id!==id});saveData(function(){renderBudget();showToast('Операция удалена','success')})}
function refreshVisible(){renderMonthNav();if(activeView==='budget'&&isEditMode){updatePeriodLabel();renderBudget()}else renderSchedule()}
function switchMonth(dir){if(activeSheet)return;var grid=document.getElementById(activeView==='budget'?'budgetView':'scheduleGrid');grid.classList.add('switching');setTimeout(function(){viewMonth+=dir;if(viewMonth>11){viewMonth=0;viewYear++}if(viewMonth<0){viewMonth=11;viewYear--}refreshVisible();window.scrollTo({top:0,behavior:'instant'});grid.classList.remove('switching')},180)}
function goToday(){if(activeSheet)return;var now=new Date();if(viewYear===now.getFullYear()&&viewMonth===now.getMonth()){var el=document.querySelector('.day-row.is-today');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}var grid=document.getElementById(activeView==='budget'?'budgetView':'scheduleGrid');grid.classList.add('switching');setTimeout(function(){viewYear=now.getFullYear();viewMonth=now.getMonth();refreshVisible();grid.classList.remove('switching');setTimeout(function(){var el=document.querySelector('.day-row.is-today');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},200)},180)}
function updateScrollTopBtn(){var btn=document.getElementById('scrollTopBtn');if(window.scrollY>400)btn.classList.add('visible');else btn.classList.remove('visible')}
function showSheet(id){activeSheet=id;document.getElementById(id).classList.add('active');document.body.style.overflow='hidden'}
function hideSheet(id){activeSheet=null;document.getElementById(id).classList.remove('active');document.body.style.overflow=''}
function showToast(msg,type){type=type||'info';var c=document.getElementById('toastContainer');var el=document.createElement('div');el.className='toast '+type;el.textContent=msg;c.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},300)},2200)}
function escHTML(str){var d=document.createElement('div');d.textContent=str;return d.innerHTML}
function jsAttr(str){return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
var touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX;touchStartY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',function(e){if(activeSheet)return;var dx=touchStartX-e.changedTouches[0].screenX,dy=touchStartY-e.changedTouches[0].screenY;if(Math.abs(dx)>80&&Math.abs(dy)<60)switchMonth(dx>0?1:-1)},{passive:true});
document.addEventListener('DOMContentLoaded',function(){loadData(onFirstLoad);document.getElementById('prevMonth').addEventListener('click',function(){switchMonth(-1)});document.getElementById('nextMonth').addEventListener('click',function(){switchMonth(1)});document.getElementById('todayBtn').addEventListener('click',goToday);document.getElementById('employeesBtn').addEventListener('click',openEmployeesSheet);document.getElementById('editBtn').addEventListener('click',toggleEditMode);document.getElementById('tabSchedule').addEventListener('click',function(){setView('schedule')});document.getElementById('tabBudget').addEventListener('click',function(){setView('budget')});document.getElementById('addIncomeBtn').addEventListener('click',function(){openBudgetSheet('income')});document.getElementById('addExpenseBtn').addEventListener('click',function(){openBudgetSheet('expense')});document.getElementById('budgetPeriodBtn').addEventListener('click',openPeriodSheet);document.getElementById('calPrev').addEventListener('click',function(){shiftCal(-1)});document.getElementById('calNext').addEventListener('click',function(){shiftCal(1)});document.getElementById('applyPeriodBtn').addEventListener('click',applyPeriod);document.getElementById('clearPeriodBtn').addEventListener('click',clearPeriod);document.getElementById('saveBudgetBtn').addEventListener('click',saveBudgetEntry);document.getElementById('typeExpense').addEventListener('click',function(){setBudgetType('expense')});document.getElementById('typeIncome').addEventListener('click',function(){setBudgetType('income')});document.getElementById('payCash').addEventListener('click',function(){setBudgetPay('cash')});document.getElementById('payCashless').addEventListener('click',function(){setBudgetPay('cashless')});document.getElementById('tabPayCash').addEventListener('click',function(){setBudgetPay('cash')});document.getElementById('tabPayCashless').addEventListener('click',function(){setBudgetPay('cashless')});document.getElementById('budgetSearch').addEventListener('input',function(){budgetQuery=this.value.toLowerCase().trim();if(activeView==='budget')renderBudget()});document.getElementById('typeDropBtn').addEventListener('click',function(){document.getElementById('typeDrop').classList.toggle('is-open')});document.getElementById('typeDropList').addEventListener('click',function(e){var btn=e.target.closest('.type-opt');if(!btn)return;syncCashlessTypeField(btn.getAttribute('data-type')||'');document.getElementById('typeDrop').classList.remove('is-open')});document.addEventListener('click',function(e){var drop=document.getElementById('typeDrop');if(!drop||drop.contains(e.target))return;drop.classList.remove('is-open')});document.getElementById('addCashlessTypeBtn').addEventListener('click',addCashlessType);document.getElementById('newCashlessType').addEventListener('keypress',function(e){if(e.key==='Enter')addCashlessType()});document.getElementById('budgetAmount').addEventListener('keypress',function(e){if(e.key==='Enter')saveBudgetEntry()});document.getElementById('clearSlotBtn').addEventListener('click',clearSlot);document.getElementById('addEmpBtn').addEventListener('click',addEmployee);document.getElementById('newEmpInput').addEventListener('keypress',function(e){if(e.key==='Enter')addEmployee()});document.getElementById('submitPwBtn').addEventListener('click',submitPassword);document.getElementById('pwInput').addEventListener('keypress',function(e){if(e.key==='Enter')submitPassword()});document.getElementById('changePwBtn').addEventListener('click',changePassword);var closeBtns=document.querySelectorAll('[data-close]');for(var i=0;i<closeBtns.length;i++)closeBtns[i].addEventListener('click',function(){hideSheet(this.getAttribute('data-close'))});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&activeSheet)hideSheet(activeSheet)});document.getElementById('scrollTopBtn').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});window.addEventListener('scroll',updateScrollTopBtn,{passive:true})});
</script>
